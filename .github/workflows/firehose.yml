name: firehose
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: firehose
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser==6.0.11
      - run: python firehose/scrape.py
      - name: Commit data
        run: |
          git config user.name "firehose-bot"
          git config user.email "firehose-bot@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && exit 0
          git commit -m "firehose: $(date -u +%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
